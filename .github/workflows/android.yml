name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  export-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Godot and export templates
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/godot_executable"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.2.stable"
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/.local/share/godot/godot_executable"
          chmod +x "$HOME/.local/share/godot/godot_executable/Godot_v4.2.2-stable_linux.x86_64"
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q -o -j /tmp/templates.tpz -d "$HOME/.local/share/godot/export_templates/4.2.2.stable"

      - name: Create Android debug keystore and editor settings
        run: |
          set -euxo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          test -d "$JAVA_HOME/bin"
          test -x "$JAVA_HOME/bin/jarsigner"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            "$JAVA_HOME/bin/keytool" -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/home/runner/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/adb = "/usr/local/lib/android/sdk/platform-tools/adb"
          export/android/jarsigner = "$JAVA_HOME/bin/jarsigner"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Patch export preset for CI debug build
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('export_presets.cfg')
          text = p.read_text()
          removals = [
              'package/signed=true\n',
              'launcher_icons/main_192x192="res://icon.svg"\n',
              'launcher_icons/adaptive_foreground_432x432="res://icon.svg"\n',
              'launcher_icons/adaptive_background_432x432=""\n',
          ]
          for value in removals:
              text = text.replace(value, '')
          insert = '''keystore/debug="/home/runner/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          '''
          if 'keystore/debug=' not in text:
              marker = '[preset.0.options]\n\n'
              text = text.replace(marker, marker + insert)
          p.write_text(text)
          print(text)
          PY

      - name: Import project
        run: |
          "$HOME/.local/share/godot/godot_executable/Godot_v4.2.2-stable_linux.x86_64" --headless -e --quit --path .

      - name: Export Android debug APK
        run: |
          set -euxo pipefail
          mkdir -p build
          "$HOME/.local/share/godot/godot_executable/Godot_v4.2.2-stable_linux.x86_64" --headless --verbose --export-debug "Android APK" "build/BuildPilot.apk" --path .
          ls -lah build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuildPilot-Android
          path: build/BuildPilot.apk
          if-no-files-found: error
