name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  export-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Patch export preset for CI debug build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('export_presets.cfg')
          text = p.read_text()
          text = text.replace('package/signed=true\n', '')
          text = text.replace('launcher_icons/main_192x192="res://icon.svg"\n', '')
          text = text.replace('launcher_icons/adaptive_foreground_432x432="res://icon.svg"\n', '')
          text = text.replace('launcher_icons/adaptive_background_432x432=""\n', '')
          if 'keystore/debug=' not in text:
              text += '\nkeystore/debug="/home/runner/.android/debug.keystore"\n'
              text += 'keystore/debug_user="androiddebugkey"\n'
              text += 'keystore/debug_password="android"\n'
          p.write_text(text)
          PY

      - name: Export Android APK with Godot
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          use_preset_export_path: true
          export_debug: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuildPilot-Android
          path: build/BuildPilot.apk
          if-no-files-found: warn
